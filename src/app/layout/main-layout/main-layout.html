<!-- disabled = menú contraído: el contenido usa todo el ancho y el menú pasa a overlay. -->
<ion-split-pane contentId="main-content" when="lg" [disabled]="!menuState.pinned()">
  <ion-menu contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>{{ appName }}</ion-title>
        <!-- Solo en pantallas anchas: en el teléfono el menú siempre es deslizable. -->
        <div slot="end" class="hidden lg:block">
          <ion-buttons>
            <ion-button
              class="menu-pin"
              [attr.aria-label]="menuState.pinned() ? 'Contraer menú' : 'Fijar menú'"
              [title]="menuState.pinned() ? 'Contraer menú' : 'Fijar menú'"
              (click)="togglePinned()"
            >
              <ion-icon
                slot="icon-only"
                [name]="menuState.pinned() ? 'chevron-back-outline' : 'pin-outline'"
              />
            </ion-button>
          </ion-buttons>
        </div>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        @for (item of items(); track item.label) {
          @if (item.path) {
            <!-- ion-menu-toggle cierra el menú al navegar (en el teléfono) -->
            <ion-menu-toggle [autoHide]="false">
              <ion-item
                [routerLink]="item.path"
                routerLinkActive="selected"
                [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                lines="none"
                detail="false"
              >
                @if (item.icon) {
                  <ion-icon slot="start" [name]="item.icon" aria-hidden="true" />
                }
                <ion-label>{{ item.label }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        }
      </ion-list>
      <ion-list>
        <app-theme-toggle />
        <app-user-menu />
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content" />
</ion-split-pane>
